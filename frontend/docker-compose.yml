services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ../database/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: ../ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/crypto_market_predictor
      JWT_SECRET: ${JWT_SECRET:-43I_5g4Tsw2YdWphZHjrv6oWa7RPiVdnidLCp6qmrXyGNSIg2r23Vh40M3_3MYnq}
      CLIENT_ORIGIN: http://localhost:8081,http://localhost:5173
      AI_SERVICE_URL: http://ai_service:8000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: .
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
